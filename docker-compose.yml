services:
  backend:
    build:
      context: .
      dockerfile: src/Dockerfile
    ports:
      - "8500:8500"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    ports:
      - "5000:5000"
    depends_on:
      - backend
    restart: unless-stopped
